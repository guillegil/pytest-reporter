name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install pytest-verify (integration tests)
        # pytest-verify is an optional integration published only on GitHub.
        # Pinned to a tag so CI exercises the real verification-card path
        # (get_check_results) reproducibly. pip ignores [tool.uv.sources].
        run: python -m pip install "pytest-verify @ git+https://github.com/guillegil/pytest_verify.git@v0.3.1"

      - name: Lint (ruff check)
        run: ruff check src/ tests/

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy -p pytest_reporter

      - name: Run tests
        run: pytest
